<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" font-family="Tahoma, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6de90"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#a8871e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="topScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120a04" stop-opacity="0.66"/>
      <stop offset="1" stop-color="#120a04" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomScrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120a04" stop-opacity="0"/>
      <stop offset="1" stop-color="#120a04" stop-opacity="0.68"/>
    </linearGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="hardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="fullClip">
      <circle cx="600" cy="600" r="556"/>
    </clipPath>
    <g id="crown">
      <path d="M8,42 L8,20 L30,34 L50,12 L70,34 L92,20 L92,42 Z" fill="url(#goldGrad)"/>
      <circle cx="8" cy="17" r="7.5" fill="#f6de90"/>
      <circle cx="50" cy="9" r="9" fill="#f6de90"/>
      <circle cx="92" cy="17" r="7.5" fill="#f6de90"/>
      <rect x="8" y="37" width="84" height="7" rx="3.5" fill="#8a6d1f"/>
      <circle cx="16" cy="40" r="2.5" fill="#6d5417"/>
      <circle cx="50" cy="40" r="2.5" fill="#6d5417"/>
      <circle cx="84" cy="40" r="2.5" fill="#6d5417"/>
    </g>
    <g id="woman">
      <path d="M35,-9.2 A52,52 0 0 1 80.8,78.8 L74.4,72.4 A43,43 0 0 0 36.5,-0.4 Z" fill="url(#goldGrad)"/>
      <path d="M37.4,4.6 A38,38 0 0 1 70.9,68.9 L64.5,62.5 A29,29 0 0 0 39,13.4 Z" fill="url(#goldGrad)"/>
      <path d="M39.5,16.4 A26,26 0 0 1 62.4,60.4 L56,54 A17,17 0 0 0 41,25.3 Z" fill="url(#goldGrad)"/>
      <path d="M50,56 C 60,60 66,70 68,88 L 20,88 C 22,70 28,60 38,56 L 50,56 Z" fill="#fdf4e0" stroke="#d4af37" stroke-width="2.5"/>
      <circle cx="44" cy="42" r="14" fill="#fdf4e0" stroke="#d4af37" stroke-width="2.5"/>
    </g>
  </defs>

  <!-- Photo: covers the whole logo -->
  <g clip-path="url(#fullClip)">
    <image x="0" y="0" width="1200" height="1200" preserveAspectRatio="xMidYMid slice" href="logo-photo.jpg"/>
    <rect width="1200" height="1200" fill="url(#vignette)"/>
    <rect y="0" width="1200" height="560" fill="url(#topScrim)"/>
    <rect y="700" width="1200" height="500" fill="url(#bottomScrim)"/>
  </g>

  <!-- Gold rings -->
  <circle cx="600" cy="600" r="556" fill="none" stroke="url(#goldGrad)" stroke-width="10"/>
  <circle cx="600" cy="600" r="536" fill="none" stroke="#f6de90" stroke-width="3" opacity="0.8" stroke-dasharray="6 14" stroke-linecap="round"/>
  <circle cx="600" cy="600" r="522" fill="none" stroke="#f6de90" stroke-width="2" opacity="0.55"/>

  <!-- Brand name (top) -->
  <text x="600" y="300" text-anchor="middle" font-size="60" font-weight="bold" fill="#fff7e6" filter="url(#textShadow)">زيت التاج</text>
  <text x="600" y="362" text-anchor="middle" font-size="26" letter-spacing="12" fill="#f0d47e" font-family="Georgia, serif" filter="url(#textShadow)">TAJ OIL</text>

  <!-- Woman (center) -->
  <g transform="translate(486 491) scale(2.6)" filter="url(#hardShadow)"><use href="#woman"/></g>

  <!-- Crown (above her head) -->
  <g transform="translate(490 375) scale(2.2)" filter="url(#hardShadow)"><use href="#crown"/></g>

  <!-- Sparkles -->
  <g fill="#f0d47e" filter="url(#textShadow)">
    <path d="M320,210 l10,30 30,10 -30,10 -10,30 -10,-30 -30,-10 30,-10 Z" opacity="0.9"/>
    <path d="M878,92 l8,24 24,8 -24,8 -8,24 -8,-24 -24,-8 24,-8 Z" opacity="0.9"/>
  </g>

  <!-- Below -->
  <text x="600" y="960" text-anchor="middle" font-size="38" font-weight="bold" fill="#fff7e6" filter="url(#textShadow)">شعرك تاجك ✨</text>
  <text x="600" y="1030" text-anchor="middle" font-size="26" letter-spacing="3" fill="#f0d47e" font-family="Georgia, serif" filter="url(#textShadow)">— MADE IN MOROCCO 🇲🇦 —</text>
</svg>
